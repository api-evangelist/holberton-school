aid: holberton-school
name: Holberton School
description: 'Holberton School is a Silicon Valley-born technology education company that
  trains software and AI engineers through project-based, peer-driven learning rather
  than traditional lectures. Students build real applications from day one, using AI as
  a learning partner while developing the collaboration and problem-solving skills employers
  need, and the school reports a 92% employment rate among alumni. Holberton operates
  campuses and partner programs globally and delivers curriculum in software engineering,
  AI/machine learning, cybersecurity, and cloud. It is tracked in the API Evangelist
  network as a portfolio company of Partech; the school publishes no public developer
  API, SDK, or well-known discovery surface at this time.'
